<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>大学祭 店舗点検リアルタイム監視パネル</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      padding: 24px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 2px solid #1e293b;
    }

    h1 { font-size: 1.6rem; font-weight: bold; }
    .sync-status { font-size: 0.9rem; color: #38bdf8; font-weight: bold; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 20px;
    }

    .card {
      background: #1e293b;
      border-radius: 12px;
      padding: 20px;
      border: 3px solid #334155;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: all 0.15s ease;
    }

    .booth-title { font-size: 1.3rem; font-weight: bold; line-height: 1.3; }
    .status-text { font-size: 0.95rem; color: #94a3b8; font-weight: 500; }

    .btn-group {
      display: flex;
      gap: 8px;
    }

    .btn-action {
      flex: 1;
      padding: 12px 8px;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
      color: #94a3b8;
      background: #334155;
      transition: transform 0.05s, background-color 0.15s;
    }
    .btn-action:disabled { cursor: not-allowed; opacity: 0.6; }
    .btn-action:not(:disabled):active { transform: scale(0.95); }

    .btn-cancel {
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: bold;
      cursor: pointer;
      color: #fca5a5;
      background: #7f1d1d;
      display: none;
      transition: transform 0.05s, background-color 0.15s;
    }
    .btn-cancel:disabled { cursor: not-allowed; opacity: 0.6; }
    .btn-cancel:active { transform: scale(0.95); }

    /* 🚨 点検要請中 */
    .card.requested {
      border-color: #ef4444 !important;
      background: #450a0a !important;
      animation: alert-flash 0.3s infinite alternate;
    }
    .card.requested .status-text { color: #fca5a5; font-weight: bold; }
    .card.requested .btn-action {
      background: #ef4444;
      color: #ffffff;
      box-shadow: 0 0 15px rgba(239, 68, 68, 0.8);
    }
    .card.requested .btn-cancel {
      display: block;
    }

    /* 🟡 点検中 */
    .card.inspecting {
      border-color: #f59e0b;
      background: #291e07;
    }
    .card.inspecting .status-text { color: #fde047; }
    .card.inspecting .btn-action {
      background: #d97706;
      color: #ffffff;
    }

    /* 🟢 完了 */
    .card.completed {
      border-color: #10b981;
      background: #022c22;
    }
    .card.completed .status-text { color: #6ee7b7; }
    .card.completed .btn-action {
      background: #059669;
      color: #ffffff;
    }

    @keyframes alert-flash {
      0% {
        box-shadow: 0 0 10px #ef4444, inset 0 0 8px #ef4444;
        transform: scale(1);
      }
      100% {
        box-shadow: 0 0 35px #ef4444, inset 0 0 25px #ef4444;
        transform: scale(1.03);
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>🚨 大学祭ブース点検監視システム</h1>
    <div class="sync-status" id="syncTime">リアルタイム同期中...</div>
  </header>

  <div class="grid" id="boothContainer"></div>

  <script>
    // 🔗 発行したGASのWebアプリURLを入力してください
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwxgDpWJNXlY3is18pYqGUY0KbSo9R-nhjijRUSUeP0olUXMrUeX_wDONZWPf4cgZZw/exec";

    // 🏷️ ここで24店舗の名前を設定します（index 0が店舗1に対応）
    const BOOTH_NAMES = [
      "1. 国語１年",
      "2. 社会科１年",
      "3. 心理１年",
      "4. 音楽１年",
      "5. 理科１年",
      "6. 特別支援１年",
      "7. [kapela]",
      "8. 技術４年",
      "9. 算数・数学４年",
      "10. さ☆ぶら",
      "11. 生活創造３年",
      "12. MOVE",
      "13. 生活創造１年",
      "14. 生活創造２年",
      "15. 養護教育１年",
      "16. 算数・数学１年",
      "17. 剣道部",
      "18. よさこい",
      "19. 教育１年",
      "20. 卓球部",
      "21. 英語１年",
      "22. 硬式野球部",
      "23. 保健体育１年",
      "24. 軟式野球部"
    ];

    let lastStatuses = {};
    let processingBooths = {};
    let audioCtx = null;

    const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

    async function fetchWithTimeout(url, timeoutMs = 5000) {
      const controller = new AbortController();
      const id = setTimeout(() => controller.abort(), timeoutMs);
      try {
        const response = await fetch(url, { signal: controller.signal });
        clearTimeout(id);
        return response;
      } catch (e) {
        clearTimeout(id);
        throw e;
      }
    }

    function playAlertSound() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(900, audioCtx.currentTime);
      osc.frequency.linearRampToValueAtTime(600, audioCtx.currentTime + 0.2);

      gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();
      osc.stop(audioCtx.currentTime + 0.2);
    }

    function initGrid() {
      const container = document.getElementById('boothContainer');
      container.innerHTML = '';

      // 1〜24店舗のカードを生成
      for (let i = 1; i <= 24; i++) {
        const boothName = BOOTH_NAMES[i - 1] || `店舗 ${i}`; // 名前が未定義の場合はフォールバック
        const card = document.createElement('div');
        card.className = 'card';
        card.id = `card-${i}`;
        card.innerHTML = `
          <div class="booth-title">${boothName}</div>
          <div class="status-text" id="status-${i}">🟢 待機中</div>
          <div class="btn-group">
            <button class="btn-action" id="btn-${i}" onclick="handleButtonClick(${i})">待機中</button>
            <button class="btn-cancel" id="btn-cancel-${i}" onclick="handleCancelClick(${i})">❌ 取消</button>
          </div>
        `;
        container.appendChild(card);
      }
    }

    function renderCard(booth, status) {
      if (processingBooths[booth]) return;

      const card = document.getElementById(`card-${booth}`);
      const statusText = document.getElementById(`status-${booth}`);
      const btn = document.getElementById(`btn-${booth}`);

      card.className = 'card ' + status;

      if (status === 'requested') {
        statusText.textContent = '🚨 点検要請が発生中！';
        btn.textContent = '▶ 点検開始';
        btn.disabled = false;
      } else if (status === 'inspecting') {
        statusText.textContent = '🟡 現在点検中...';
        btn.textContent = '✔ 点検完了にする';
        btn.disabled = false;
      } else if (status === 'completed') {
        statusText.textContent = '⭕ 点検完了';
        btn.textContent = 'リセット（待機へ）';
        btn.disabled = false;
      } else {
        statusText.textContent = '🟢 待機中';
        btn.textContent = '待機中';
        btn.disabled = true;
      }
    }

    async function syncStatuses() {
      try {
        const res = await fetchWithTimeout(`${GAS_URL}?_t=${Date.now()}`, 3000);
        const data = await res.json();
        let soundRequired = false;

        // 24店舗分を同期
        for (let i = 1; i <= 24; i++) {
          const key = String(i);
          const serverStatus = data[key] || 'waiting';

          if (processingBooths[i]) continue;

          if (serverStatus === 'requested' && lastStatuses[key] !== 'requested') {
            soundRequired = true;
          }

          renderCard(i, serverStatus);
          lastStatuses[key] = serverStatus;
        }

        if (soundRequired) playAlertSound();
        document.getElementById('syncTime').textContent = `最終更新: ${new Date().toLocaleTimeString()}`;

      } catch (e) {
        // エラー時はスキップ
      }
    }

    function setCardLoading(booth, isLoading, message = "⏳ 更新中...") {
      processingBooths[booth] = isLoading;
      const btn = document.getElementById(`btn-${booth}`);
      const btnCancel = document.getElementById(`btn-cancel-${booth}`);
      const statusText = document.getElementById(`status-${booth}`);

      if (isLoading) {
        btn.disabled = true;
        if (btnCancel) btnCancel.disabled = true;
        btn.textContent = message;
        statusText.textContent = message;
      }
    }

    async function handleButtonClick(booth) {
      const key = String(booth);
      const currentStatus = lastStatuses[key];
      const name = BOOTH_NAMES[booth - 1] || `店舗 ${booth}`;
      let nextStatus = 'waiting';

      if (currentStatus === 'requested') {
        nextStatus = 'inspecting';
      } else if (currentStatus === 'inspecting') {
        nextStatus = 'completed';
      } else if (currentStatus === 'completed') {
        const confirmResult = confirm(`「${name}」の点検完了を取り消し、待機状態にリセットしますか？`);
        if (!confirmResult) return;
        nextStatus = 'waiting';
      }

      setCardLoading(booth, true, "⏳ 認証確認中...");

      try {
        const fetchPromise = fetchWithTimeout(`${GAS_URL}?action=update&booth=${booth}&status=${nextStatus}&_t=${Date.now()}`, 6000);
        const timerPromise = sleep(1500);

        const [res] = await Promise.all([fetchPromise, timerPromise]);
        const data = await res.json();

        if (data.result === 'success') {
          lastStatuses[key] = nextStatus;
          processingBooths[booth] = false;
          renderCard(booth, nextStatus);
        } else if (data.result === 'error') {
          alert(data.message || '運営の確認が間違っています。担当者に確認してください');
          processingBooths[booth] = false;
          renderCard(booth, currentStatus);
        } else {
          throw new Error('Server error');
        }
      } catch (e) {
        alert('通信エラーまたはサーバー応答に時間がかかりました。もう一度お試しください。');
        processingBooths[booth] = false;
        syncStatuses();
      }
    }

    async function handleCancelClick(booth) {
      const key = String(booth);
      const name = BOOTH_NAMES[booth - 1] || `店舗 ${booth}`;
      const confirmResult = confirm(`「${name}」の点検要請を取り消しますか？`);
      if (!confirmResult) return;

      setCardLoading(booth, true, "⏳ 更新中...");

      try {
        const fetchPromise = fetchWithTimeout(`${GAS_URL}?action=cancel&booth=${booth}&_t=${Date.now()}`, 5000);
        const timerPromise = sleep(1500);

        const [res] = await Promise.all([fetchPromise, timerPromise]);
        const data = await res.json();

        if (data.result === 'success') {
          lastStatuses[key] = 'waiting';
          processingBooths[booth] = false;
          renderCard(booth, 'waiting');
        } else {
          throw new Error('Server error');
        }
      } catch (e) {
        alert('通信エラーが発生しました。もう一度お試しください。');
        processingBooths[booth] = false;
        syncStatuses();
      }
    }

    window.addEventListener('click', () => {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }, { once: true });

    initGrid();
    syncStatuses();
    setInterval(syncStatuses, 1500);
  </script>
</body>
</html>
